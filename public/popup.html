<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Q&amp;A</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        width: 320px;
        min-height: 200px;
        background: #fff;
        color: #0f0f0f;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e5e5;
        background: #cc0000;
        color: #fff;
      }

      header h1 { font-size: 15px; font-weight: 600; }

      .status-list {
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #ccc;
      }
      .dot.ok   { background: #16a34a; }
      .dot.warn { background: #d97706; }
      .dot.err  { background: #dc2626; }

      .label { color: #606060; flex: 1; }
      .value { font-weight: 500; }

      #video-section {
        padding: 12px 16px;
        border-top: 1px solid #e5e5e5;
      }

      #video-id {
        font-size: 12px;
        color: #606060;
        word-break: break-all;
      }

      footer {
        padding: 10px 16px;
        border-top: 1px solid #e5e5e5;
        display: flex;
        justify-content: flex-end;
      }

      footer a {
        font-size: 12px;
        color: #cc0000;
        text-decoration: none;
      }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <h1>YouTube Q&amp;A</h1>
    </header>

    <div class="status-list">
      <div class="status-row">
        <span class="dot" id="dot-backend"></span>
        <span class="label">Backend</span>
        <span class="value" id="val-backend">checking…</span>
      </div>
      <div class="status-row">
        <span class="dot" id="dot-apikey"></span>
        <span class="label">API key</span>
        <span class="value" id="val-apikey">checking…</span>
      </div>
    </div>

    <div id="video-section">
      <div class="status-row">
        <span class="dot" id="dot-video"></span>
        <span class="label">Current video</span>
      </div>
      <div id="video-id">—</div>
    </div>

    <footer>
      <a id="options-link" href="#">Options</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
